<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>music_demo 知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* 首页「晴空」：明亮、柔和。首页只放领域：每个领域一块带底色的圆角大卡片，点进去是它的领域页；
   背景是几块柔光色斑，首屏一条渐变色的波形丝带。
   扩展方式见 <body> 里的注释：加领域 = 加一个 .dom，统计数字自动更新。 */
:root{--bg:#FBFAF6;--fg:#1D2330;--muted:#687083;--card:#FFFFFF;--shadow:rgba(29,35,48,.5);
  --g1:#2F6BDE;--g2:#7B5CF0;--g3:#D9582B;--blob1:#BFD9FF;--blob2:#FFD3BD;--blob3:#BDEBD5;
  /* 领域色：卡片底色 / 强调色。领域用 data-tone 选一种 */
  --sky:#DCEBFF;--sky-d:#2F6BDE;--peach:#FFE4D6;--peach-d:#D9582B;--mint:#D8F3E6;--mint-d:#128A5B;--violet:#E9E2FF;--violet-d:#6B4FE0;--sand:#F6EBC8;--sand-d:#A67400;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101319;--fg:#ECEEF4;--muted:#9AA3B5;--card:#1B2029;--shadow:rgba(0,0,0,.8);
  --g1:#7FB0FF;--g2:#A995FF;--g3:#FF9A73;--blob1:#1B3A6B;--blob2:#5A2E1F;--blob3:#16483A;
  --sky:#16233D;--sky-d:#7FB0FF;--peach:#37221A;--peach-d:#FF9A73;--mint:#14302A;--mint-d:#5FD4A4;--violet:#251F42;--violet-d:#A995FF;--sand:#332B14;--sand-d:#E6BE55;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101319;--fg:#ECEEF4;--muted:#9AA3B5;--card:#1B2029;--shadow:rgba(0,0,0,.8);
  --g1:#7FB0FF;--g2:#A995FF;--g3:#FF9A73;--blob1:#1B3A6B;--blob2:#5A2E1F;--blob3:#16483A;
  --sky:#16233D;--sky-d:#7FB0FF;--peach:#37221A;--peach-d:#FF9A73;--mint:#14302A;--mint-d:#5FD4A4;--violet:#251F42;--violet-d:#A995FF;--sand:#332B14;--sand-d:#E6BE55;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--fg);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;background:var(--bg);overflow-x:hidden;position:relative;min-height:100vh}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--g1);outline-offset:3px;border-radius:8px}

/* 背景色斑 */
.blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:0;pointer-events:none}
.blob.b1{width:520px;height:520px;left:-200px;top:120px;background:radial-gradient(circle,var(--blob1),transparent 70%)}
.blob.b2{width:600px;height:600px;right:-220px;top:-120px;background:radial-gradient(circle,var(--blob2),transparent 70%)}
.blob.b3{width:520px;height:520px;right:-140px;bottom:-220px;background:radial-gradient(circle,var(--blob3),transparent 70%)}

.page{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:22px 40px 56px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13.5px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);letter-spacing:.06em}
.brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2));display:block}

.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding:64px 0 44px}
.hero svg{position:absolute;left:-40px;top:20px;width:calc(100% + 80px);height:220px;z-index:-1}
.hero svg .s1{stop-color:var(--g1)}.hero svg .s2{stop-color:var(--g2)}.hero svg .s3{stop-color:var(--g3)}
h1{font-size:clamp(60px,10vw,132px);line-height:1;font-weight:900;margin:0;letter-spacing:-.02em}
h1 span{background:linear-gradient(100deg,var(--g1),var(--g2) 30%,var(--g3) 55%,var(--g2) 80%,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{max-width:40ch;color:var(--muted);font-size:17px;margin:20px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:var(--card);border-radius:20px;padding:14px 20px;min-width:96px;box-shadow:0 10px 30px -18px var(--shadow)}
.stat b{display:block;font-size:34px;line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

/* 领域卡片：一行三张，整张都是链接。上面是图标和名字，中间一句话和分类名，底下是脚本写的篇数 */
.doms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.dom{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:340px;border-radius:30px;padding:28px 26px 26px;background:var(--tint);transition:transform .18s,box-shadow .18s}
.dom:hover{transform:translateY(-4px);box-shadow:0 26px 44px -30px var(--shadow)}
.dom[data-tone="sky"]{--tint:var(--sky);--tone:var(--sky-d)}
.dom[data-tone="peach"]{--tint:var(--peach);--tone:var(--peach-d)}
.dom[data-tone="mint"]{--tint:var(--mint);--tone:var(--mint-d)}
.dom[data-tone="violet"]{--tint:var(--violet);--tone:var(--violet-d)}
.dom[data-tone="sand"]{--tint:var(--sand);--tone:var(--sand-d)}
.dom .ic{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;color:var(--bg);background:var(--tone)}
.dom .ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dom .t{font-size:clamp(34px,3.4vw,46px);font-weight:900;line-height:1.2;margin-top:10px}
.dom .d{font-size:16px;max-width:22em}
.dom .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dom .chips i{font-style:normal;font-size:13.5px;line-height:1.5;padding:4px 13px;border-radius:999px;background:var(--card)}
.dom .m{margin-top:auto;padding:22px 62px 0 0;font-family:var(--mono);font-size:12px;opacity:.75}
.dom .go{position:absolute;right:24px;bottom:24px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--card);transition:background .18s,color .18s}
.dom:hover .go{background:var(--tone);color:var(--bg)}
.foot{margin-top:36px;display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}

@media (max-width:760px){
  .page{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .hero{grid-template-columns:minmax(0,1fr);padding:40px 0 28px}
  .stats{justify-content:flex-start}.stat{min-width:0;padding:10px 16px;border-radius:16px}.stat b{font-size:26px}
  .dom{border-radius:24px;padding:22px 18px 20px}.dom .go{right:18px;bottom:18px}
}
@media (max-width:900px){.doms{grid-template-columns:minmax(0,1fr)}.dom{min-height:0}}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.dom,.dom .go{transition:none}.dom:hover{transform:none}}

/* ---- 动画 ----
   入场：标题、统计、领域卡片依次浮现（--i 是脚本写入的序号，用来错开时间）。
   常驻：背景色斑缓慢漂移，波形丝带起伏，"库"字的渐变流动。
   系统开了"减少动态效果"时全部关闭。 */
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.92)}60%{transform:translateY(-2px) scale(1.03)}to{opacity:1;transform:none}}
@keyframes drift1{to{transform:translate(70px,50px) scale(1.12)}}
@keyframes drift2{to{transform:translate(-80px,60px) scale(1.08)}}
@keyframes drift3{to{transform:translate(-50px,-70px) scale(1.15)}}
@keyframes sheen{to{background-position:200% 50%}}
@keyframes nudge{50%{transform:translateX(4px)}}
@keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}
.blob.b1{animation:drift1 16s ease-in-out infinite alternate}
.blob.b2{animation:drift2 20s ease-in-out infinite alternate}
.blob.b3{animation:drift3 18s ease-in-out infinite alternate}
.brand{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
h1{animation:rise .8s cubic-bezier(.2,.7,.2,1) .05s both}
h1 span{background-size:200% 100%;animation:sheen 7s linear infinite}
.lede{animation:rise .8s cubic-bezier(.2,.7,.2,1) .18s both}
.hero svg{animation:rise 1.2s ease-out .1s both}
.stat{animation:pop .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.3s + var(--i,0) * .08s)}
/* 卡片入场只填充开头（backwards），结束后不占着 transform，悬停上浮才生效 */
.dom{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(.42s + var(--i,0) * .12s)}
.dom:hover .ic{animation:beat .5s ease}
.dom:hover .go{animation:nudge .7s ease-in-out infinite}
/* 页面过渡：与 assets/kb.css 里的规则配套，两边都声明才会生效 */
@view-transition{navigation:auto}
@keyframes vt-out{to{opacity:0;transform:translateY(-12px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(18px)}}
::view-transition-old(root){animation:vt-out .2s ease-in both}
::view-transition-new(root){animation:vt-in .38s cubic-bezier(.2,.7,.2,1) .08s both}
::view-transition-group(page-title){animation-duration:.45s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
::view-transition-old(page-title),::view-transition-new(page-title){height:100%;object-fit:contain;object-position:left center}
@media (prefers-reduced-motion: reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  .blob,.brand,h1,h1 span,.lede,.hero svg,.stat,.dom,.dom:hover .ic,.dom:hover .go{animation:none}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div class="page">
  <div class="nav">
    <div class="brand"><i></i>MUSIC_DEMO</div>
  </div>

  <header class="hero">
    <svg id="ribbon" viewBox="0 0 1400 220" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" x2="1"><stop class="s1" offset="0"/><stop class="s2" offset=".55"/><stop class="s3" offset="1"/></linearGradient></defs>
      <path d="M0 120 C120 20 200 200 330 110 S560 30 680 120 900 210 1020 100 1250 40 1400 130" fill="none" stroke="url(#g)" stroke-width="3" stroke-opacity=".35">
        <animate attributeName="d" dur="11s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
          values="M0 120 C120 20 200 200 330 110 S560 30 680 120 900 210 1020 100 1250 40 1400 130;M0 100 C120 190 200 30 330 120 S560 200 680 100 900 20 1020 130 1250 190 1400 90;M0 120 C120 20 200 200 330 110 S560 30 680 120 900 210 1020 100 1250 40 1400 130"/>
      </path>
      <path d="M0 150 C140 70 230 210 360 140 S600 80 720 150 930 220 1060 130 1270 90 1400 160" fill="none" stroke="url(#g)" stroke-width="14" stroke-opacity=".10" stroke-linecap="round">
        <animate attributeName="d" dur="15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
          values="M0 150 C140 70 230 210 360 140 S600 80 720 150 930 220 1060 130 1270 90 1400 160;M0 130 C140 200 230 60 360 150 S600 210 720 130 930 60 1060 160 1270 200 1400 120;M0 150 C140 70 230 210 360 140 S600 80 720 150 930 220 1060 130 1270 90 1400 160"/>
      </path>
    </svg>
    <div>
      <h1>知识<span>库</span></h1>
      <p class="lede">做这个工程时整理的学习笔记，以音视频为主，也记别的。先选一个领域，进去先看地图，再按顺序往下读。</p>
    </div>
    <!-- 四个数字由脚本根据下面的领域卡片自动统计，不用手改 -->
    <div class="stats" aria-label="统计">
      <div class="stat"><b id="n-dom">–</b><span>领域</span></div>
      <div class="stat"><b id="n-kind">–</b><span>分类</span></div>
      <div class="stat"><b id="n-article">–</b><span>文章</span></div>
      <div class="stat"><b id="n-demo">–</b><span>演示</span></div>
    </div>
  </header>

  <!--
    扩展方式
    首页只放领域，一个领域一张 <a class="dom">；分类、主题、文章都在各自的领域页里（av/、network/、ai/ 下的 index.html）。
    · 加文章、主题或分类：改对应的领域页，再回来改这张卡片上的三个数：
      data-cats（分类数）/ data-articles（文章数，领域页最上面「先看地图」那一页不算）/ data-demos（交互演示数）。
      .chips 里一个 <i> 写一个分类名，和领域页里的分类对上。
    · 加领域：复制一个 <a class="dom">，改 href、名字、一句话说明、分类名和三个数，
      data-tone 从 sky / peach / mint / violet / sand 里选一个没用过的颜色；
      再照 av/index.html 写它的领域页：先看地图，再按知识的先后排分类，分类之间写一句承接。
    首屏四个统计数字和卡片底下的「N 个分类 · N 篇文章」都是脚本生成的。
  -->
  <main class="doms">
    <a class="dom" href="av/index.html" data-tone="sky" data-cats="4" data-articles="9" data-demos="5">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z"/></svg></span>
      <span class="t">音视频</span>
      <span class="d">一个视频文件怎么变成画面和声音。</span>
      <span class="chips"><i>封装格式</i><i>音频</i><i>视频</i><i>构建</i></span>
      <span class="m"></span>
      <span class="go" aria-hidden="true">→</span>
    </a>

    <a class="dom" href="network/index.html" data-tone="mint" data-cats="3" data-articles="10" data-demos="0">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.7 2.9 2.7 15.1 0 18M12 3c-2.7 2.9-2.7 15.1 0 18"/></svg></span>
      <span class="t">网络</span>
      <span class="d">一个请求怎么送到对方，再把页面带回来。</span>
      <span class="chips"><i>包怎么送到对方</i><i>两端怎么对话</i><i>拼起来用</i></span>
      <span class="m"></span>
      <span class="go" aria-hidden="true">→</span>
    </a>

    <a class="dom" href="ai/index.html" data-tone="violet" data-cats="1" data-articles="7" data-demos="0">
      <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 6.8 17 11.2M7 17.2l10-4.4M5 8v8"/></svg></span>
      <span class="t">AI</span>
      <span class="d">模型怎么从数据里学会预测。</span>
      <span class="chips"><i>机器学习</i></span>
      <span class="m"></span>
      <span class="go" aria-hidden="true">→</span>
    </a>
  </main>

  <div class="foot"><span>docs/index.html</span></div>
</div>

<script>
// 根据领域卡片生成统计数字和每张卡片底下的"N 个分类 · N 篇文章 · N 个交互演示"
let kinds=0,articles=0,demos=0;
const doms=[...document.querySelectorAll('.dom')];
doms.forEach((k,i)=>{
  const c=+k.dataset.cats||0,a=+k.dataset.articles||0,d=+k.dataset.demos||0;kinds+=c;articles+=a;demos+=d;
  k.querySelector('.m').textContent=[c&&`${c} 个分类`,a&&`${a} 篇文章`,d&&`${d} 个交互演示`].filter(Boolean).join(' · ');
  k.style.setProperty('--i',i);
});
// 动画：给统计写入序号用来错开入场时间；统计数字从 0 滚到目标值
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.stat').forEach((e,i)=>e.style.setProperty('--i',i));
[['n-dom',doms.length],['n-kind',kinds],['n-article',articles],['n-demo',demos]].forEach(([id,n],i)=>{
  const el=document.getElementById(id);
  if(still){el.textContent=n;return;}
  el.textContent=0;
  const t0=performance.now()+350+i*80,dur=900;
  const tick=t=>{const k=Math.min(1,Math.max(0,(t-t0)/dur));el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick);};
  requestAnimationFrame(tick);
  setTimeout(()=>{el.textContent=n;},1700+i*80);
});
if(still)document.getElementById('ribbon').pauseAnimations();

// 页面过渡：点哪张卡片，就让它的名字变形成领域页的大标题；从领域里的页面返回时反过来。
// "page-title" 这个名字同一时刻只能给一个元素，所以每次先清掉再设。
const nameTitle=card=>{doms.forEach(k=>k.querySelector('.t').style.viewTransitionName='');if(card)card.querySelector('.t').style.viewTransitionName='page-title';};
doms.forEach(k=>k.addEventListener('click',()=>nameTitle(k)));
addEventListener('pagereveal',e=>{
  const from=window.navigation?.activation?.from?.url;
  if(!e.viewTransition||!from){nameTitle(null);return;}
  // 从哪个领域的目录回来的，就把那张卡片的名字作为变形的终点
  const back=doms.find(k=>from.startsWith(new URL('.',k.href).href));
  nameTitle(back||null);
  e.viewTransition.finished.finally(()=>nameTitle(null));
});
</script>
</body>
</html>
